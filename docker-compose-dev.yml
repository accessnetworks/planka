services:
  planka-server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: planka-dev
    pull_policy: never
    command: ["bash", "-c", "npm install && npm run db:init && npm start"]
    restart: on-failure
    volumes:
      - ./server:/app
    ports:
      - 1337:1337
    environment:
      - BASE_URL=http://localhost:1337
      - DATABASE_URL=postgresql://postgres@postgres/planka
      - SECRET_KEY=notsecretkey

      # Skip the "accept terms of service" step at login for all users.
      - TERMS_DISABLED=true

      # - LOG_LEVEL=warn

      # - TRUST_PROXY=true
      # - MAX_UPLOAD_FILE_SIZE=
      # - TOKEN_EXPIRES_IN=365 # In days

      # - STORAGE_LIMIT=
      # - ACTIVE_USERS_LIMIT=

      # related: https://github.com/knex/knex/issues/2354
      # As knex does not pass query parameters from the connection string,
      # we have to use environment variables in order to pass the desired values, e.g.
      # - PGSSLMODE=<value>

      # Configure knex to accept SSL certificates
      # - KNEX_REJECT_UNAUTHORIZED_SSL_CERTIFICATE=false

      # The default application language used as a fallback when a user's language is not set.
      # This language is also used for per-board notifications.
      # - DEFAULT_LANGUAGE=en-US

      # Do not comment out DEFAULT_ADMIN_EMAIL if you want to prevent this user from being edited/deleted
      # - DEFAULT_ADMIN_EMAIL=demo@demo.demo
      # - DEFAULT_ADMIN_PASSWORD=demo
      # - DEFAULT_ADMIN_NAME=Demo Demo
      # - DEFAULT_ADMIN_USERNAME=demo

      # Set to true to show more detailed authentication error messages.
      # It should not be enabled without a rate limiter for security reasons.
      # - SHOW_DETAILED_AUTH_ERRORS=false

      # All outgoing HTTP requests (SMTP, webhooks, Apprise notifications, favicon fetching, etc.)
      # will be sent through this proxy if set.
      # - OUTGOING_PROXY=http://proxy:3128

      # Set to true to expose the Swagger specification at /swagger.json
      # - SWAGGER_EXPOSED=false

      # - S3_ENDPOINT=
      # - S3_REGION=
      # - S3_ACCESS_KEY_ID=
      # - S3_SECRET_ACCESS_KEY=
      # - S3_BUCKET=
      # - S3_FORCE_PATH_STYLE=true
      # - S3_REQUEST_CHECKSUM_CALCULATION=

      # Single sign-on via OIDC (Authentik — the same IdP RavAN uses).
      # Secrets are pulled from a local, git-ignored .env file so the client
      # secret is never committed; see .env.example for what to fill in.
      # OIDC stays disabled until OIDC_ISSUER is set (empty issuer = off), so
      # local login keeps working out of the box.
      #
      # New SSO users are auto-provisioned in the local Postgres DB. With
      # OIDC_IGNORE_ROLES=true every SSO user is created (and kept) as the
      # "boardUser" role — Authentik groups can never escalate them to
      # project owner or admin. This is the "just board user perms" behavior.
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_SCOPES=${OIDC_SCOPES:-openid email profile}
      - OIDC_IGNORE_ROLES=true
      # Uncomment to hide the local login form and force SSO-only sign-in:
      # - OIDC_ENFORCED=true
      # Uncomment for verbose OIDC logs while setting this up:
      # - OIDC_DEBUG=true

      # Email Notifications (https://nodemailer.com/smtp/)
      # These values override and disable configuration in the UI if set.
      # - SMTP_HOST=
      # - SMTP_PORT=587
      # - SMTP_NAME=
      # - SMTP_SECURE=true
      # - SMTP_TLS_REJECT_UNAUTHORIZED=false
      # - SMTP_USER=
      # - SMTP_PASSWORD=
      # - SMTP_FROM="Demo Demo" <demo@demo.demo>

      # Using Gravatar directly exposes user IPs and hashed emails to a third party (GDPR risk).
      # Use a proxy you control for privacy, or leave commented out or empty to disable.
      # - GRAVATAR_BASE_URL=https://www.gravatar.com/avatar/
    depends_on:
      postgres:
        condition: service_healthy

  planka-client:
    image: planka-dev
    pull_policy: never
    command: ["bash", "-c", "npm install && npx vite --host"]
    restart: on-failure
    volumes:
      - ./client:/app
      - ./CHANGELOG.md:/CHANGELOG.md
    ports:
      - 3000:3000
    environment:
      - PROXY_TARGET=http://planka-server:1337

  postgres:
    image: postgres:16-alpine
    restart: on-failure
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=planka
      - POSTGRES_HOST_AUTH_METHOD=trust
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-planka} && psql -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-planka} -c 'SELECT 1'",
        ]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 10s

  # Automatic Postgres backups. Takes a gzipped pg_dump of the `planka`
  # database on startup and then every BACKUP_INTERVAL seconds, writing to the
  # host ./backups directory and pruning to the newest BACKUP_KEEP dumps.
  # Restore with:
  #   gunzip -c ./backups/planka-<timestamp>.sql.gz \
  #     | docker compose -f docker-compose-dev.yml exec -T postgres psql -U postgres -d planka
  postgres-backup:
    image: postgres:16-alpine
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    environment:
      - PGHOST=postgres
      - PGUSER=postgres
      - PGDATABASE=planka
      # How often to back up (seconds; default 6h) and how many dumps to keep.
      - BACKUP_INTERVAL=21600
      - BACKUP_KEEP=14
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -o pipefail
        trap 'exit 0' TERM INT
        rm -f /backups/*.tmp
        echo "postgres-backup: every $${BACKUP_INTERVAL}s, keeping $${BACKUP_KEEP} dumps in /backups"
        while true; do
          ts=$$(date -u +%Y%m%dT%H%M%SZ)
          out="/backups/planka-$${ts}.sql.gz"
          echo "postgres-backup: dumping to $${out}"
          # A complete dump ends with this marker; only prune after a good one.
          if pg_dump --clean --if-exists | gzip -c > "$${out}.tmp" &&
            gzip -dc "$${out}.tmp" | tail -n 20 | grep -q 'PostgreSQL database dump complete'; then
            mv "$${out}.tmp" "$${out}"
            echo "postgres-backup: wrote $${out}"
            ls -1t /backups/planka-*.sql.gz 2>/dev/null | tail -n +$$(($${BACKUP_KEEP} + 1)) | xargs -r rm -f
          else
            echo "postgres-backup: dump FAILED, older dumps kept"
            rm -f "$${out}.tmp"
          fi
          sleep "$${BACKUP_INTERVAL}" &
          wait $$!
        done

volumes:
  db-data:
